name: Wanderlust Production Deployment


on:
  push:
    branches:
      - master


jobs:

  deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64


    steps:


    # --------------------------------
    # Checkout Repository
    # --------------------------------

    - name: Checkout Code

      uses: actions/checkout@v4



    # --------------------------------
    # Setup Node.js
    # --------------------------------

    - name: Setup Node.js

      uses: actions/setup-node@v4

      with:
        node-version: 22
        cache: npm



    # --------------------------------
    # Install Backend Dependencies
    # --------------------------------

    - name: Install Backend Dependencies

      working-directory: backend

      run: npm ci



    # --------------------------------
    # Install Frontend Dependencies
    # --------------------------------

    - name: Install Frontend Dependencies

      working-directory: frontend

      run: npm ci



    # --------------------------------
    # Build Frontend
    # --------------------------------

    - name: Build Frontend

      working-directory: frontend

      run: npm run build



    # --------------------------------
    # Deploy Backend
    # --------------------------------

    - name: Deploy Backend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\backend"

        $destination = "C:\Wanderlust-project\backend"


        if (!(Test-Path $destination)) {

            New-Item -ItemType Directory -Path $destination -Force

        }


        Copy-Item `
        "$source\*" `
        $destination `
        -Recurse `
        -Force



    # --------------------------------
    # Deploy Frontend
    # --------------------------------

    - name: Deploy Frontend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\frontend\dist"

        $destination = "C:\Wanderlust-project\frontend\dist"


        if (!(Test-Path $destination)) {

            New-Item -ItemType Directory -Path $destination -Force

        }


        Copy-Item `
        "$source\*" `
        $destination `
        -Recurse `
        -Force



    # --------------------------------
    # Install Backend Production Packages
    # --------------------------------

    - name: Install Production Packages

      shell: powershell

      run: |

        cd C:\Wanderlust-project\backend

        npm install --production



    # --------------------------------
    # Restart Backend using PM2
    # --------------------------------

    - name: Restart Backend PM2

      shell: powershell

      run: |


        # Add global npm binaries path

        $env:Path += ";C:\Users\Administrator\AppData\Roaming\npm"


        cd C:\Wanderlust-project\backend



        pm2 describe wanderlust-backend


        if ($LASTEXITCODE -eq 0) {

            Write-Host "Restarting existing application"

            pm2 restart wanderlust-backend

        }

        else {

            Write-Host "Starting new application"

            pm2 start server.js --name wanderlust-backend

            pm2 save

        }



    # --------------------------------
    # Reload Nginx
    # --------------------------------

    - name: Reload Nginx

      shell: powershell

      run: |


        $env:Path += ";C:\nginx"


        nginx -t

        nginx -s reload



    # --------------------------------
    # Deployment Verification
    # --------------------------------

    - name: Verify Deployment

      shell: powershell

      run: |


        $env:Path += ";C:\Users\Administrator\AppData\Roaming\npm"

        $env:Path += ";C:\nginx"


        Write-Host "Checking PM2"

        pm2 list


        Write-Host "Checking Nginx"

        nginx -t
