name: Wanderlust Production Deployment


on:
  push:
    branches:
      - master


jobs:

  deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64


    steps:


    # -----------------------------
    # Checkout Repository
    # -----------------------------

    - name: Checkout Code
      uses: actions/checkout@v4



    # -----------------------------
    # Setup Node.js
    # -----------------------------

    - name: Setup Node.js
      uses: actions/setup-node@v4

      with:
        node-version: 20



    # -----------------------------
    # Install Backend Dependencies
    # -----------------------------

    - name: Install Backend Dependencies

      working-directory: backend

      run: npm install



    # -----------------------------
    # Install Frontend Dependencies
    # -----------------------------

    - name: Install Frontend Dependencies

      working-directory: frontend

      run: npm install



    # -----------------------------
    # Build React Frontend
    # -----------------------------

    - name: Build Frontend

      working-directory: frontend

      run: npm run build



    # -----------------------------
    # Deploy Backend Files
    # -----------------------------

    - name: Deploy Backend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\backend"

        $destination = "C:\Users\Administrator\Wanderlust-project\backend"


        if (!(Test-Path $destination)) {

          New-Item -ItemType Directory -Path $destination

        }


        Copy-Item "$source\*" $destination -Recurse -Force



    # -----------------------------
    # Deploy Frontend Build
    # -----------------------------

    - name: Deploy Frontend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\frontend\dist"

        $destination = "C:\Users\Administrator\Wanderlust-project\frontend\dist"


        if (!(Test-Path $destination)) {

          New-Item -ItemType Directory -Path $destination

        }


        Copy-Item "$source\*" $destination -Recurse -Force



    # -----------------------------
    # Install Production Packages
    # -----------------------------

    - name: Install Backend Production Packages

      shell: powershell

      run: |

        cd C:\Users\Administrator\Wanderlust-project\backend

        npm install --production



    # -----------------------------
    # Restart Node Backend
    # -----------------------------

    - name: Restart Backend Using PM2

      shell: powershell

      run: |


        cd C:\Users\Administrator\Wanderlust-project\backend


        pm2 describe wanderlust-backend


        if ($LASTEXITCODE -eq 0) {

            pm2 restart wanderlust-backend

        }

        else {

            pm2 start server.js --name wanderlust-backend

        }



    # -----------------------------
    # Reload Nginx
    # -----------------------------

    - name: Reload Nginx

      shell: powershell

      run: |


        nginx -s reload



    # -----------------------------
    # Deployment Verification
    # -----------------------------

    - name: Verify Deployment

      shell: powershell

      run: |


        pm2 list

        nginx -t
