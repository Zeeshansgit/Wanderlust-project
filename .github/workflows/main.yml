name: Deploy Wanderlust to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:


env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: wanderlust


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

    # ---------------------------------------------------
    # STEP 1 - CHECKOUT CODE
    # ---------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4



    # ---------------------------------------------------
    # STEP 2 - LOGIN DOCKER HUB
    # ---------------------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3

      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}



    # ---------------------------------------------------
    # STEP 3 - BUILD FRONTEND IMAGE
    # ---------------------------------------------------
    - name: Build Frontend Docker Image

      run: |

        docker build \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} \
        ./frontend




    # ---------------------------------------------------
    # STEP 4 - BUILD BACKEND IMAGE
    # ---------------------------------------------------
    - name: Build Backend Docker Image

      run: |

        docker build \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} \
        ./backend




    # ---------------------------------------------------
    # STEP 5 - PUSH IMAGES TO DOCKER HUB
    # ---------------------------------------------------
    - name: Push Docker Images

      run: |

        docker push \
        ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}


        docker push \
        ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}





    # ---------------------------------------------------
    # STEP 6 - CONFIGURE AWS
    # ---------------------------------------------------
    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v5

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}






    # ---------------------------------------------------
    # STEP 7 - INSTALL KUBECTL
    # ---------------------------------------------------
    - name: Setup kubectl

      uses: azure/setup-kubectl@v4






    # ---------------------------------------------------
    # STEP 8 - CONNECT TO EKS
    # ---------------------------------------------------
    - name: Update kubeconfig

      run: |

        aws eks update-kubeconfig \
        --name ${{ env.CLUSTER_NAME }} \
        --region ${{ env.AWS_REGION }}






    # ---------------------------------------------------
    # STEP 9 - CREATE NAMESPACE
    # ---------------------------------------------------
    - name: Create Namespace

      run: |

        kubectl create namespace ${{ env.K8S_NAMESPACE }} \
        --dry-run=client -o yaml | kubectl apply -f -






    # ---------------------------------------------------
    # STEP 10 - CREATE DOCKER HUB SECRET
    # ---------------------------------------------------
    - name: Create DockerHub Secret

      run: |

        kubectl create secret docker-registry dockerhub-creds \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
        --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
        --docker-email=${{ secrets.DOCKERHUB_EMAIL }} \
        -n ${{ env.K8S_NAMESPACE }} \
        --dry-run=client -o yaml | kubectl apply -f -





    # ---------------------------------------------------
    # STEP 11 - APPLY KUBERNETES FILES
    # ---------------------------------------------------
    - name: Deploy Kubernetes Manifests

      run: |

        kubectl apply \
        -f kubernetes/ \
        -n ${{ env.K8S_NAMESPACE }}






    # ---------------------------------------------------
    # STEP 12 - UPDATE FRONTEND IMAGE
    # ---------------------------------------------------
    - name: Update Frontend Image

      run: |

        kubectl set image deployment/frontend-deployment \
        frontend=${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} \
        -n ${{ env.K8S_NAMESPACE }}






    # ---------------------------------------------------
    # STEP 13 - UPDATE BACKEND IMAGE
    # ---------------------------------------------------
    - name: Update Backend Image

      run: |

        kubectl set image deployment/backend-deployment \
        backend=${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} \
        -n ${{ env.K8S_NAMESPACE }}






    # ---------------------------------------------------
    # STEP 14 - VERIFY FRONTEND
    # ---------------------------------------------------
    - name: Frontend Rollout Status

      run: |

        kubectl rollout status \
        deployment/frontend-deployment \
        -n ${{ env.K8S_NAMESPACE }} \
        --timeout=120s






    # ---------------------------------------------------
    # STEP 15 - VERIFY BACKEND
    # ---------------------------------------------------
    - name: Backend Rollout Status

      run: |

        kubectl rollout status \
        deployment/backend-deployment \
        -n ${{ env.K8S_NAMESPACE }} \
        --timeout=120s






    # ---------------------------------------------------
    # STEP 16 - SHOW RUNNING PODS
    # ---------------------------------------------------
    - name: Verify Pods

      run: |

        kubectl get pods \
        -n ${{ env.K8S_NAMESPACE }} \
        -o wide





        