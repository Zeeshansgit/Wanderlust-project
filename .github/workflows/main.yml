name: Wanderlust Production Deployment

on:
  push:
    branches:
      - master


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

    # -------------------------
    # Checkout Repository
    # -------------------------

    - name: Checkout Code
      uses: actions/checkout@v4



    # -------------------------
    # Setup Node.js
    # -------------------------

    - name: Setup Node.js
      uses: actions/setup-node@v4

      with:
        node-version: 20



    # -------------------------
    # Backend Dependencies
    # -------------------------

    - name: Install Backend Dependencies
      working-directory: backend

      run: npm install



    # -------------------------
    # Frontend Build
    # -------------------------

    - name: Install Frontend Dependencies
      working-directory: frontend

      run: npm install



    - name: Build Frontend
      working-directory: frontend

      run: npm run build



    # -------------------------
    # Deploy Backend
    # -------------------------

    - name: Copy Backend Files To Server

      uses: appleboy/scp-action@v0.1.7

      with:

        host: ${{ secrets.SERVER_HOST }}

        username: ${{ secrets.SERVER_USER }}

        password: ${{ secrets.SERVER_PASSWORD }}

        source: "backend/*"

        target: "C:/Users/Administrator/Wanderlust-project"



    # -------------------------
    # Deploy Frontend Build
    # -------------------------

    - name: Copy Frontend Build To Server

      uses: appleboy/scp-action@v0.1.7

      with:

        host: ${{ secrets.SERVER_HOST }}

        username: ${{ secrets.SERVER_USER }}

        password: ${{ secrets.SERVER_PASSWORD }}

        source: "frontend/dist/*"

        target: "C:/Users/Administrator/Wanderlust-project/frontend/dist"



    # -------------------------
    # Restart Backend + Nginx
    # -------------------------

    - name: Restart Application

      uses: appleboy/ssh-action@v1

      with:

        host: ${{ secrets.SERVER_HOST }}

        username: ${{ secrets.SERVER_USER }}

        password: ${{ secrets.SERVER_PASSWORD }}


        script: |

          cd C:\Users\Administrator\Wanderlust-project\backend

          npm install


          pm2 restart wanderlust-backend


          nginx -s reload