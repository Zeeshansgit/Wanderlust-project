name: Wanderlust Production Deployment


on:
  push:
    branches:
      - master


jobs:

  deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64


    steps:


    # --------------------------------
    # Checkout Repository
    # --------------------------------

    - name: Checkout Code

      uses: actions/checkout@v4



    # --------------------------------
    # Setup Node.js
    # --------------------------------

    - name: Setup Node.js

      uses: actions/setup-node@v4

      with:
        node-version: 22
        cache: npm



    # --------------------------------
    # Install Backend Dependencies
    # --------------------------------

    - name: Install Backend Dependencies

      working-directory: backend

      run: npm ci



    # --------------------------------
    # Install Frontend Dependencies
    # --------------------------------

    - name: Install Frontend Dependencies

      working-directory: frontend

      run: npm ci



    # --------------------------------
    # Build Frontend
    # --------------------------------

    - name: Build Frontend

      working-directory: frontend

      run: npm run build



    # --------------------------------
    # Deploy Backend Files
    # --------------------------------

    - name: Deploy Backend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\backend"

        $destination = "C:\Wanderlust-project\backend"


        if (!(Test-Path $destination)) {

            New-Item -ItemType Directory -Path $destination -Force

        }


        Copy-Item `
        "$source\*" `
        $destination `
        -Recurse `
        -Force



    # --------------------------------
    # Deploy Frontend Build
    # --------------------------------

    - name: Deploy Frontend

      shell: powershell

      run: |

        $source = "${{ github.workspace }}\frontend\dist"

        $destination = "C:\Wanderlust-project\frontend\dist"


        if (!(Test-Path $destination)) {

            New-Item -ItemType Directory -Path $destination -Force

        }


        Copy-Item `
        "$source\*" `
        $destination `
        -Recurse `
        -Force



    # --------------------------------
    # Install Backend Production Packages
    # --------------------------------

    - name: Install Production Dependencies

      shell: powershell

      run: |

        cd C:\Wanderlust-project\backend

        npm install --production



    # --------------------------------
    # Restart Backend using PM2
    # --------------------------------

    - name: Restart Backend PM2

      shell: powershell

      run: |


        $pm2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"


        cd C:\Wanderlust-project\backend


        Write-Host "PM2 Version"

        & $pm2 -v



        Write-Host "Checking Application"



        & $pm2 describe wanderlust-backend



        if ($LASTEXITCODE -eq 0) {


            Write-Host "Restarting Existing Application"


            & $pm2 restart wanderlust-backend


        }

        else {


            Write-Host "Starting New Application"


            & $pm2 start server.js --name wanderlust-backend


            & $pm2 save


        }



    # --------------------------------
    # Reload Nginx
    # --------------------------------

    - name: Reload Nginx

      shell: powershell

      run: |


        $nginx = "C:\nginx\nginx.exe"


        Write-Host "Testing Nginx Configuration"


        & $nginx -t



        Write-Host "Reloading Nginx"


        & $nginx -s reload



    # --------------------------------
    # Verify Deployment
    # --------------------------------

    - name: Verify Deployment

      shell: powershell

      run: |


        $pm2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"

        $nginx = "C:\nginx\nginx.exe"



        Write-Host "PM2 Status"

        & $pm2 list



        Write-Host "Nginx Status"

        & $nginx -t
