name: Wanderlust Production Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # --------------------------------
      # Checkout Repository
      # --------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------
      # Setup Node.js
      # --------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # --------------------------------
      # Install Backend Dependencies
      # --------------------------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci


      # --------------------------------
      # Install Frontend Dependencies
      # --------------------------------

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci


      # --------------------------------
      # Build Frontend
      # --------------------------------

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


      # --------------------------------
      # Deploy Backend Files
      # --------------------------------

      - name: Deploy Backend
        shell: powershell
        run: |

          $source = "${{ github.workspace }}\backend"
          $destination = "C:\Wanderlust-project\backend"

          Write-Host "Deploying backend..."

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Copy-Item `
            "$source\*" `
            $destination `
            -Recurse `
            -Force `
            -Exclude "node_modules"

          Write-Host "Backend deployment completed."


      # --------------------------------
      # Deploy Frontend Build
      # --------------------------------

      - name: Deploy Frontend
        shell: powershell
        run: |

          $source = "${{ github.workspace }}\frontend\dist"
          $destination = "C:\Wanderlust-project\frontend\dist"

          Write-Host "Deploying frontend..."

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Copy-Item `
            "$source\*" `
            $destination `
            -Recurse `
            -Force

          Write-Host "Frontend deployment completed."


      # --------------------------------
      # Install Production Dependencies
      # --------------------------------

      - name: Install Production Dependencies
        shell: powershell
        run: |

          Set-Location "C:\Wanderlust-project\backend"

          Write-Host "Installing production dependencies..."

          npm install --omit=dev

          Write-Host "Production dependencies installed."


      # --------------------------------
      # Verify PM2
      # --------------------------------

      - name: Verify PM2
        shell: powershell
        run: |

          Write-Host "Checking PM2..."

          pm2 -v

          Write-Host "PM2 location:"

          where.exe pm2

          Write-Host "PM2 processes:"

          pm2 list


      # --------------------------------
      # Restart Backend using PM2
      # --------------------------------

      - name: Restart Backend PM2
        shell: powershell
        run: |

          Set-Location "C:\Wanderlust-project\backend"

          Write-Host "Checking PM2 application..."

          pm2 describe wanderlust-backend

          if ($LASTEXITCODE -eq 0) {

              Write-Host "Existing application found."
              Write-Host "Restarting Wanderlust backend..."

              pm2 restart wanderlust-backend

          }
          else {

              Write-Host "Application not found."
              Write-Host "Starting Wanderlust backend..."

              pm2 start server.js --name wanderlust-backend
          }

          Write-Host "Saving PM2 process list..."

          pm2 save

          Write-Host "PM2 deployment completed."


      # --------------------------------
      # Reload Nginx
      # --------------------------------

      - name: Reload Nginx
        shell: powershell
        run: |

          $nginx = "C:\nginx\nginx.exe"

          Write-Host "Checking Nginx executable..."

          if (!(Test-Path $nginx)) {

              Write-Error "Nginx executable not found at $nginx"

              exit 1
          }

          Write-Host "Testing Nginx configuration..."

          & $nginx -t

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Nginx configuration test failed."

              exit 1
          }

          Write-Host "Nginx configuration is valid."

          Write-Host "Reloading Nginx..."

          & $nginx -s reload

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Nginx reload failed."

              exit 1
          }

          Write-Host "Nginx reloaded successfully."


      # --------------------------------
      # Verify Deployment
      # --------------------------------

      - name: Verify Deployment
        shell: powershell
        run: |

          Write-Host "================================="
          Write-Host "Deployment Verification"
          Write-Host "================================="

          Write-Host ""
          Write-Host "PM2 Status:"
          pm2 list

          Write-Host ""
          Write-Host "Backend Application:"
          pm2 describe wanderlust-backend

          Write-Host ""
          Write-Host "Backend Port:"
          netstat -ano | findstr :3500

          Write-Host ""
          Write-Host "Nginx Configuration:"
          & "C:\nginx\nginx.exe" -t

          Write-Host ""
          Write-Host "================================="
          Write-Host "Deployment Completed Successfully"
          Write-Host "================================="
