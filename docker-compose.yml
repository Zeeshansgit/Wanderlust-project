version: "3.8"

services:

  backend:
    image: zeeshanshaikh799/wanderlust-backend:latest
    container_name: wanderlust-backend
    restart: always

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production

    depends_on:
      - redis


  frontend:
    image: zeeshanshaikh799/wanderlust-frontend:latest
    container_name: wanderlust-frontend
    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend


  redis:
    image: redis:7-alpine
    container_name: wanderlust-redis
    restart: always

    ports:
      - "6379:6379"